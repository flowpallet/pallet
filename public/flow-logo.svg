  <g fill="#FFFFFF">
    <!-- 'f' -->
    <path d="M 148 296 C 144 296 140 298 138 301 C 136 303 137 305 139 305 C 141 305 142 303 144 302 C 145 301 147 300 149 300 C 153 300 155 303 155 307 L 155 310 L 140 310 L 140 313 L 155 313 L 155 338 C 155 342 152 344 147 344 L 147 346 L 161 346 L 161 344 C 157 344 156 342 156 338 L 156 313 L 166 313 L 166 310 L 156 310 L 156 306 C 156 299 152 296 148 296 Z" />
    
